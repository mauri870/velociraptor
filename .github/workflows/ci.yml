name: tests

# The package alone, on the CPU: the CPU build of torch (the `cpu` group) and the tests (the ones that may run on a device run their CPU path).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the package with its test dependencies and the CPU build of torch
        run: uv sync --group cpu
      - name: Tests
        run: uv run --group cpu pytest tests -q

  triceratops:
    # The package exists to run TRICERATOPS; this job is the only one that installs it and runs the tests that need it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.13"
          enable-cache: true
      - name: Install the package with its test dependencies, the CPU build of torch and the triceratops extra
        run: uv sync --group cpu --extra triceratops
      - name: Tests
        run: uv run --group cpu --extra triceratops pytest tests -q

  lowest:
    # SPEC 0: the lowest versions the dependencies declare must still work, not only the newest uv resolves.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.13"
          enable-cache: true
      - name: Install the package at the lowest version of every direct dependency
        run: uv sync --resolution lowest-direct --group cpu
      - name: Tests
        run: uv run --no-sync --group cpu pytest tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Ruff
        run: uv run --only-dev ruff check
